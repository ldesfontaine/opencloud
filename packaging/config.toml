# Configuration d'openCloud. Ce fichier appartient à l'opérateur : une mise à
# jour du paquet ne l'écrase pas (dpkg garde le vôtre et pose la version neuve
# à côté, en config.toml.dpkg-dist, si elle diffère).

# Adresse d'écoute de l'interface. 127.0.0.1 : seule cette machine y accède.
# Pour l'ouvrir, mettre l'adresse du réseau de confiance ou passer par le proxy.
# L'unité n'a aucune capacité : un port sous 1024 demande un drop-in systemd
# (AmbientCapabilities=CAP_NET_BIND_SERVICE), ou le proxy devant.
listen = "127.0.0.1:8080"

# Répertoire d'état : base, sauvegardes, clés. Créé par le paquet, gardé par
# `apt remove`, retiré par `apt purge`. Le déplacer le sort du périmètre de
# `apt purge`, qui ne connaît que /var/lib/opencloud.
state_dir = "/var/lib/opencloud"

# Longueur minimale d'un nouveau mot de passe, en caractères (12 : l'OWASP pour
# un compte d'administration). 0 lève la règle, sur un réseau de confiance.
min_password_length = 12

# Proxies de confiance, adresses ou CIDR : derrière eux seulement,
# X-Forwarded-For dit l'adresse d'origine. Vide, l'en-tête est ignoré.
trusted_proxies = []

# Le jeton GitHub de `opencloud self-update` n'est pas ici : ce fichier est
# lisible par le service, qui n'en a pas l'usage. Il vit dans
# /etc/opencloud/github-token, en 0600 root:root, lu par self-update seul.
