{{define "sidebar"}}
<aside class="side">
  <a class="brand" href="/">
    <span class="mark">{{template "mark"}}</span>
    <span class="wordmark"><span>open</span><b>Cloud</b></span>
  </a>
  {{range .Nav}}
  <div class="side-label">{{.Label}}</div>
  <nav class="nav">
    {{range .Items}}
    <a class="nav-item{{if eq .Key $.Active}} active{{end}}" href="{{.Href}}"{{if eq .Key $.Active}} aria-current="page"{{end}}>
      {{template "icon" .Icon}}
      <span>{{.Label}}</span>
      {{if .HasCount}}<span class="count{{if .Hot}} hot{{end}}">{{.Count}}</span>{{end}}
    </a>
    {{end}}
  </nav>
  {{end}}
  <div class="side-foot">
    <div class="theme" role="group">
      <button type="button" data-set-theme="light" aria-label="{{.T.ThemeLight}}" title="{{.T.ThemeLight}}">{{template "icon" "sun"}}</button>
      <button type="button" data-set-theme="dark" aria-label="{{.T.ThemeDark}}" title="{{.T.ThemeDark}}">{{template "icon" "moon"}}</button>
    </div>
    <div class="account">
      <span class="avatar" aria-hidden="true">{{.Account.Initial}}</span>
      <span class="who"><b>{{.Account.Name}}</b><span>{{.Account.Role}}</span></span>
    </div>
  </div>
</aside>
{{end}}
