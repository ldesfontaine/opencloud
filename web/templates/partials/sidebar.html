{{define "sidebar"}}
<aside class="side">
  <a class="brand" href="/">
    <span class="mark">{{template "mark"}}</span>
    <span class="wordmark"><span>open</span><b>Cloud</b></span>
  </a>
  {{range .Nav}}
  <div class="side-label">{{.Label}}</div>
  <nav class="nav">
    {{range .Items}}
    <a class="nav-item{{if eq .Key $.Active}} active{{end}}" href="{{.Href}}"{{if eq .Key $.Active}} aria-current="page"{{end}}>
      {{template "icon" .Icon}}
      <span>{{.Label}}</span>
      {{if .HasCount}}<span class="count{{if .Hot}} hot{{end}}">{{.Count}}</span>{{end}}
    </a>
    {{end}}
  </nav>
  {{end}}
  <div class="side-foot">
    <div class="switches">
      <div class="theme" role="group">
        <button type="button" data-set-theme="light" aria-label="{{.T.Get "theme.light"}}" title="{{.T.Get "theme.light"}}">{{template "icon" "sun"}}</button>
        <button type="button" data-set-theme="dark" aria-label="{{.T.Get "theme.dark"}}" title="{{.T.Get "theme.dark"}}">{{template "icon" "moon"}}</button>
      </div>
      <form class="theme lang" method="post" action="/langue" aria-label="{{.T.Get "language.label"}}">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <input type="hidden" name="return" value="{{.Return}}">
        {{range .Languages}}
        <button type="submit" name="language" value="{{.Code}}" title="{{.Label}}" aria-label="{{.Label}}"{{if .Active}} class="active" aria-current="true"{{end}}>{{.Code}}</button>
        {{end}}
      </form>
    </div>
    <div class="account">
      <span class="avatar" aria-hidden="true">{{.Account.Initial}}</span>
      <span class="who"><b>{{.Account.Name}}</b><span>{{.Account.Role}}</span></span>
    </div>
  </div>
</aside>
{{end}}
