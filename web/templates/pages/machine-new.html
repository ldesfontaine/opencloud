{{define "content"}}
<section class="card form-card">
  <form class="card-b" method="post" action="/machines/nouvelle">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <div class="field">
      <label for="machine-name">{{.T.Get "machine.name_label"}}</label>
      <input id="machine-name" class="input" type="text" name="name" value="{{.Page.Name}}" placeholder="vps-paris-1" autocomplete="off" autofocus required>
      <span class="field-help">{{.T.Get "machine.name_help"}}</span>
      {{if .Page.ErrorKey}}<span class="pill pill-danger">{{.T.Get .Page.ErrorKey}}</span>{{end}}
    </div>
    <div class="cluster">
      <button type="submit" class="btn btn-primary">{{template "icon" "plus"}}{{.T.Get "machine.create_token"}}</button>
      <a class="btn btn-ghost" href="/machines">{{.T.Get "machine.cancel"}}</a>
    </div>
  </form>
</section>
{{end}}
