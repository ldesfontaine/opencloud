{{define "title"}}Mot de passe{{end}}
{{define "content"}}
<section class="card narrow">
  <h1>Changer le mot de passe</h1>
  {{if .Account.MustChangePassword}}
  <p class="notice">Le mot de passe par défaut doit être changé avant de continuer.</p>
  {{end}}
  <form method="post" action="/password">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <label for="current_password">Mot de passe actuel</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
    <label for="new_password">Nouveau mot de passe</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
    <label for="confirm_password">Confirmer le nouveau mot de passe</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button type="submit">Changer</button>
  </form>
</section>
{{end}}
