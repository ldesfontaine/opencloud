# Les actions sont épinglées par SHA de commit : un tag est un pointeur mobile.
# Plumber (.plumber.yaml) vérifie cette politique à chaque exécution.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks lit les commits de la PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: test
        run: go test ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

      - name: shellcheck
        run: make shellcheck

      - name: secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/opencloud ./cmd/opencloud

  # Le paquet .deb, sur le runner lui-même — une vraie machine Ubuntu avec
  # systemd : build reproductible, installation, mise à jour, remove, purge.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build reproductible
        run: make reproducible VERSION=0.0.2 DIST=dist/new

      - name: version précédente du paquet
        run: make release VERSION=0.0.1 DIST=dist/old

      - name: installation, mise à jour, remove, purge
        run: sudo packaging/test-install.sh dist/old/opencloud_0.0.1_amd64.deb dist/new/opencloud_0.0.2_amd64.deb

      # Le runner est une vraie machine Ubuntu : sshd et sudo y sont, et la
      # machine openCloud s'y enrôle sur elle-même par SSH vers localhost.
      - name: amorçage, Diagnostiquer par l'interface, reprise
        run: |
          sudo apt-get install -y -qq openssh-server > /dev/null
          sudo packaging/test-action.sh dist/new/opencloud_0.0.2_amd64.deb

      # Le témoin, un conteneur Debian avec sshd, est enrôlé depuis l'interface
      # par la commande générée, puis Diagnostiquer tourne dessus par SSH. Le
      # runner a Docker ; le job Debian, lui, n'a pas de démon dedans.
      - name: enrôlement d'une machine distante, le témoin
        run: sudo packaging/test-enroll.sh dist/new/opencloud_0.0.2_amd64.deb

  # Le même paquet, mais dans le conteneur Debian 12 avec systemd : le job
  # ci-dessus ne prouve qu'Ubuntu, et le critère est « sur une Debian neuve ».
  # `make package-test` est la cible jouée en local, inchangée : elle construit
  # les deux versions, joue test-install.sh puis test-action.sh, et remonte le
  # code de sortie du conteneur.
  package-debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Le conteneur porte systemd, pas de démon Docker : privilégié et cgroups
      # de l'hôte lui suffisent, rien n'est imbriqué.
      - name: installation, mise à jour, Diagnostiquer et Poser le socle sur Debian 12
        run: make package-test

  plumber:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: politique CI/CD
        uses: getplumber/plumber@c85c712bca3c9f547a88c66bb2541db179a1a79e # v0.4.52
        with:
          version: v0.4.52
          verify-attestation: "true"
          config-file: .plumber.yaml
          min-points: "100"
          fail-warnings: "true"
          soft-fail: "false"
          upload-sarif: "false"
          upload-artifacts: "false"
          pbom: ""
          pbom-cyclonedx: ""
          sarif: ""
