# /etc/opencloud/config.toml — configuration de `opencloud serve`.
# Toutes les clés sont facultatives : sans elles, les valeurs par défaut
# ci-dessous s'appliquent. Une clé inconnue est signalée au démarrage
# (WARN « unknown key … ignored ») et ignorée ; une valeur invalide arrête
# le démarrage.

# Adresse d'écoute, hôte:port. Par défaut 127.0.0.1:8080 : seuls les
# processus de la même machine peuvent joindre openCloud, Traefik en mode host
# comme tout autre. Un voisin qui atteint ce port en direct n'est pas arrêté
# par l'adresse ; en mode forward, voir forward_secret_file plus bas.
# Traefik en conteneur : l'IP du pont Docker, par exemple 172.17.0.1:8080.
listen = "127.0.0.1:8080"

# Répertoire d'état : la base SQLite (opencloud.db, avec -wal et -shm), qui
# porte aussi les réglages de l'interface, et le cache lifecycle.json. Créé
# en 0700 s'il manque. Par défaut /var/lib/opencloud.
state_dir = "/var/lib/opencloud"

# Adresse publique d'openCloud, telle que les machines et le navigateur
# l'appellent. Elle sert à :
#  - écrire la commande d'installation d'une machine et l'URL de ping d'une
#    tâche ;
#  - reconnaître le nom sous lequel on atteint l'interface : une requête
#    sur /api/… dont le Host n'est ni ce nom, ni
#    localhost, ni une IP, ni l'hôte de `listen` est refusée en
#    403 {"error":"bad_host"} (protection contre le DNS rebinding).
# Vide (défaut) : déduite de chaque requête, et tout nom de domaine autre
# que localhost est refusé sur l'API. Derrière un domaine, renseignez-la.
public_url = "https://opencloud.example.org"

# Adresse de mcp-maison, le serveur MCP installé à côté d'openCloud
# (installation.md, « Brancher un agent IA »). Paramètres → Agent IA lit son
# /health pour dire s'il répond. Vide (défaut) : openCloud ne le cherche pas
# et marche sans lui. L'hôte est celui de MCP_HOST, le port 3000.
# mcp_url = "http://127.0.0.1:3000"

# Mandataires dont les en-têtes X-Forwarded-For, -Host et -Proto sont crus,
# en notation CIDR. Vide (défaut) : aucun, l'adresse vue est celle du pair.
# Traefik en mode host : 127.0.0.1/32, mais cette adresse est celle de tous
# les processus de la machine, pas la preuve de passer par Traefik : en mode
# forward, posez forward_secret_file. Traefik en conteneur : son IP fixe en
# /32 (docker inspect <conteneur>), jamais le sous-réseau.
trusted_proxies = ["127.0.0.1/32", "::1/128"]

# Mode forward (SSO devant openCloud) : fichier d'une ligne qui porte le
# secret partagé avec le mandataire, 32 caractères au moins. Le mandataire le
# pose dans l'en-tête X-OpenCloud-Proxy-Secret (Traefik : headers.
# customRequestHeaders, qui remplace la valeur du client) ; une requête qui ne
# le porte pas exactement une fois répond 401. Obligatoire pour activer le mode
# forward quand trusted_proxies couvre la boucle locale. Créez-le avec
#   openssl rand -hex 32 > /etc/opencloud/forward.secret
#   chown root:opencloud /etc/opencloud/forward.secret
#   chmod 0640 /etc/opencloud/forward.secret
# Un fichier illisible, trop court ou lisible par les autres comptes arrête le
# démarrage. Vide (défaut) : l'adresse du pair seule décide.
# forward_secret_file = "/etc/opencloud/forward.secret"

# Mode forward : les identités que le mandataire peut transmettre et
# qu'openCloud admet, une seconde serrure derrière le SSO. Une autre identité
# répond 403 (et un WARN qui la nomme). Vide ou absent (défaut) : toute
# identité transmise est admise. Comparaison exacte, majuscules comprises :
# "Lucas" n'est pas "lucas". Relu au démarrage seulement.
# forward_users = ["lucas"]

# Niveau du journal (JSON sur stderr) : debug, info, warn, error.
# Vide (défaut) : info. En debug, chaque requête HTTP fait une ligne.
log_level = "info"
