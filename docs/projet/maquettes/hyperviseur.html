<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openCloud · Onglet Hyperviseur (maquette)</title>
<!-- Maquette de l'onglet Hyperviseur (P1). Données fictives. Paramètres de
l'adresse : ?theme=dark · ?blind=1 (le jeton ne voit pas les sauvegardes) ·
?open=stopped (les arrêtées dépliées) · ?menu=1 (menu d'une carte ouvert). -->
<style>
/* Jetons : docs/projet/21-direction-artistique.md, tels quels. */
:root{
  --bg:#f6f6f8;--surface:#fff;--surface-2:#f1f2f5;--line:#e5e7ec;--line-strong:#d3d6de;
  --ink:#101216;--ink-2:#4b5160;--muted:#7a8194;--accent:#5b5be6;--accent-wash:#eeeefc;
  --ok:#1f9d57;--ok-wash:#e4f6ec;--warn:#d78d0c;--warn-wash:#fdf2dc;--danger:#de4350;--danger-wash:#fde9eb;
  --primary:#101216;--primary-ink:#fff;
  --sans:"Geist",ui-sans-serif,"Segoe UI",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
[data-theme=dark]{
  --bg:#0d0e12;--surface:#15171c;--surface-2:#1c1f26;--line:#262a33;--line-strong:#353a47;
  --ink:#eef0f4;--ink-2:#b3b8c4;--muted:#7d8494;--accent:#7c7cf0;--accent-wash:#1f2040;
  --ok:#3ac776;--ok-wash:#12301f;--warn:#f0a92a;--warn-wash:#33260d;--danger:#f06470;--danger-wash:#3a1a1e;
  --primary:#eef0f4;--primary-ink:#101216;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.45 var(--sans)}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.sec{color:var(--ink-2)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.main{padding:28px 32px;max-width:1240px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn.danger{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.sm{height:20px;padding:0 8px;font-size:11px}.pill.nodot:before{display:none}
.t-ok{background:var(--ok-wash);color:var(--ok)}.t-warn{background:var(--warn-wash);color:var(--warn)}
.t-danger{background:var(--danger-wash);color:var(--danger)}.t-neutral{background:var(--surface-2);color:var(--muted)}
.t-accent{background:var(--accent-wash);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.card-t{font-weight:600;font-size:14px}.card-s{margin-left:auto;color:var(--muted)}
.label{color:var(--muted);font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase}

/* L'hôte : une bande, pas un tableau de valeurs */
.host{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 20px}
.host .fact{display:flex;flex-direction:column;gap:2px}
.host .actions{margin-left:auto;display:flex;gap:8px}

/* Le jeton ne voit pas les sauvegardes */
.blind{border-color:var(--warn);background:var(--warn-wash)}
.blind .body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.blind h2{margin:0;font-size:14px}
.step{display:flex;flex-direction:column;gap:6px}
.step b{font-weight:600}
.cmd{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 6px 6px 12px}
.cmd code{flex:1;font:12px var(--mono);overflow-x:auto;white-space:nowrap}

/* Stockages */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;padding:16px 20px}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);border-left:3px solid var(--line-strong)}
.tile.running{border-left-color:var(--ok)}.tile.paused{border-left-color:var(--warn)}.tile.full{border-left-color:var(--danger)}.tile.ok{border-left-color:var(--accent)}
.tile .top{display:flex;align-items:center;gap:8px}
.tile .name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tile .top .push{margin-left:auto;display:flex;align-items:center;gap:6px}
.kind{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.meter.warn i{background:var(--warn)}.meter.danger i{background:var(--danger)}
.gauges{display:flex;flex-direction:column;gap:7px}
.gauge{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.gauge span:last-child{text-align:right}
.rows{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;gap:10px;align-items:baseline}.row .k{width:92px;flex:none;color:var(--muted)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.menu-wrap{position:relative}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.menu{position:absolute;right:0;top:34px;z-index:2;min-width:230px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(16,18,22,.12)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}.menu button.off{color:var(--muted);cursor:not-allowed}
.menu button small{display:block;color:var(--muted)}

/* Sections repliables */
details.fold{border-top:1px solid var(--line)}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .chev{color:var(--muted);transition:transform .15s}details.fold[open]>summary .chev{transform:rotate(180deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
@media (max-width:600px){.main{padding:20px 16px}.cards{grid-template-columns:1fr;padding:12px 16px}.host .actions{margin-left:0}}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
 <symbol id="i-vm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
 <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
 <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
 <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
</svg>
<div class="main"><div class="stack" id="root"></div></div>
<script>
const params = new URLSearchParams(location.search);
if (params.get("theme")==="dark") document.documentElement.dataset.theme="dark";
const blind = params.get("blind")==="1";
const GiB = 1024**3;
// [vmid, type, nom, état, vCPU, mémoire, disque, machine liée, dernière sauvegarde (heures), taille, stockage]
const guests = [
 [101,"qemu","docker1","running",4,8,64,"docker1",9,"12,4 Gio","pi-sauvegardes"],
 [102,"qemu","vpn","running",2,2,16,"vpn",9,"3,1 Gio","pi-sauvegardes"],
 [104,"lxc","dns","running",1,0.5,8,null,9,"0,6 Gio","pi-sauvegardes"],
 [105,"qemu","immich","running",4,16,256,"immich",80,"41 Gio","pi-sauvegardes"],
 [201,"qemu","windows-test","stopped",4,8,80,null,null,"","" ],
 [202,"lxc","vieux-wiki","stopped",1,1,12,null,500,"1,2 Gio","pi-sauvegardes"],
 [9000,"qemu","debian-12","stopped",2,1,4,null,null,"",""]];
const storages = [
 ["local","pve","dir",0.22,"41 Gio / 100 Gio",["iso","vztmpl"],false],
 ["local-lvm","pve","lvmthin",0.61,"610 Gio / 1 Tio",["images","rootdir"],false],
 ["pi-sauvegardes","pve","nfs",0.83,"1,6 Tio / 2 Tio",["backup"],true]];
const ico = (n)=>`<svg class="ico"><use href="#i-${n}"/></svg>`;
const maxMem = Math.max(...guests.map(g=>g[5])), maxDisk = Math.max(...guests.map(g=>g[6]));
function age(h){ if(h===null) return ["Aucune","t-warn"]; if(h===undefined) return ["Inconnue","t-neutral"];
  const t = h<48?"t-ok":h<168?"t-warn":"t-danger"; const label = h<24?`il y a ${h} h`:`il y a ${Math.round(h/24)} j`; return [label,t]; }
function meter(p,cls=""){return `<div class="meter ${cls}" role="meter" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`}
function guestCard(g){
  const [id,kind,name,state,cpu,mem,disk,linked,hours,size,store]=g;
  const running = state==="running";
  const [when,tone] = blind && hours===null ? ["Inconnue","t-neutral"] : age(hours);
  return `<article class="tile ${running?"running":""}">
    <div class="top">${ico(kind==="qemu"?"vm":"box")}<span class="name">${name}</span><span class="mono muted">${id}</span>
      <span class="push"><span class="pill sm ${running?"t-ok":"t-neutral"}">${running?"En marche":"Arrêtée"}</span>
      <span class="menu-wrap"><button class="icon-btn" aria-label="Actions de ${name}" data-menu="${id}">${ico("more")}</button>
      <div class="menu" ${params.get("menu")==="1"&&id===105?"":"hidden"} role="menu">
        <button role="menuitem">Arrêter proprement</button><button role="menuitem">Prendre un instantané</button>
        <button class="off" role="menuitem" disabled>Démarrer<small>La VM tourne déjà</small></button></div></span></span></div>
    <div class="kind">${kind==="qemu"?"Machine virtuelle":"Conteneur LXC"} · alloué</div>
    <div class="gauges">
      <div class="gauge"><span class="sec">Processeur</span>${meter(cpu/4*100)}<span class="mono">${cpu} vCPU</span></div>
      <div class="gauge"><span class="sec">Mémoire</span>${meter(mem/maxMem*100)}<span class="mono">${mem} Gio</span></div>
      <div class="gauge"><span class="sec">Disque</span>${meter(disk/maxDisk*100)}<span class="mono">${disk} Gio</span></div></div>
    <div class="rows">
      <div class="row"><span class="k">Machine</span>${linked?`<a href="#">${linked}</a>`:'<span class="muted">Pas enrôlée</span>'}</div>
      <div class="row"><span class="k">Sauvegarde</span><span class="pill sm ${tone}">${when}</span>${size&&!(blind&&hours===null)?`<span class="mono muted">${size} · ${store}</span>`:""}</div>
    </div></article>`;
}
function storageCard([name,node,type,used,text,content,backup]){
  const cls = used>.9?"danger":used>.75?"warn":"";
  return `<article class="tile ${backup?"ok":""}"><div class="top">${ico("db")}<span class="name">${name}</span><span class="mono muted">${node}</span>
    <span class="push">${backup&&blind?'<span class="pill sm t-warn">Sauvegardes illisibles</span>':backup?'<span class="pill sm t-accent">Reçoit les sauvegardes</span>':""}</span></div>
    <div class="kind">${type}</div>${meter(Math.round(used*100),cls)}
    <div class="row"><span class="mono">${text}</span><span class="mono muted" style="margin-left:auto">${Math.round(used*100)} %</span></div>
    <div class="row"><span class="k" style="width:auto">Contenu</span><span class="mono">${content.join(", ")}</span></div></article>`;
}
const live = guests.filter(g=>g[3]==="running"), stopped = guests.filter(g=>g[3]!=="running"&&g[0]!==9000), templates = guests.filter(g=>g[0]===9000);
document.getElementById("root").innerHTML = `
 <div class="card"><div class="host">
   <div class="fact"><span class="label">Hôte Proxmox VE</span><span class="mono">https://pve.lan:8006</span></div>
   <div class="fact"><span class="label">Version</span><span class="mono">8.2.4</span></div>
   <div class="fact"><span class="label">Nœud</span><span class="mono">pve</span></div>
   <div class="fact"><span class="label">Jeton</span><span class="mono">open…</span></div>
   <div class="fact"><span class="label">Dernier relevé</span><span>il y a 2 min</span></div>
   <div class="actions"><button class="btn">Modifier</button><button class="btn danger">Retirer</button></div></div></div>
 ${blind?`<div class="card blind" role="alert"><div class="body">
   <h2>Les sauvegardes ne sont pas lisibles avec ce jeton</h2>
   <span class="sec">Le jeton peut lister les VM mais pas les archives du stockage <b class="mono">pi-sauvegardes</b> : « Aucune » serait faux, l'écran dit « Inconnue ». Collez ces deux commandes dans le terminal de l'hôte Proxmox ; la lecture suivante (5 min) le confirme.</span>
   <div class="step"><b>1. Créer le rôle (une fois)</b><div class="cmd"><code>pveum role add OpenCloudSauvegardes --privs "Datastore.Audit Datastore.Allocate"</code><button class="btn">${ico("copy")}Copier</button></div></div>
   <div class="step"><b>2. Le donner au jeton, sur ce stockage seulement</b><div class="cmd"><code>pveum acl modify /storage/pi-sauvegardes --roles OpenCloudSauvegardes --tokens 'opencloud@pve!lecture'</code><button class="btn">${ico("copy")}Copier</button></div></div>
   <span class="muted">Ce que ça ouvre : Datastore.Allocate permet aussi de supprimer des archives de ce stockage. openCloud ne fait que lire.</span></div></div>`:""}
 <div class="card"><div class="card-h"><span class="card-t">Stockages</span><span class="card-s">${storages.length}</span></div>
   <div class="cards">${storages.map(storageCard).join("")}</div></div>
 <div class="card"><div class="card-h"><span class="card-t">Machines virtuelles et conteneurs</span><span class="card-s">${live.length} en marche · ${stopped.length} arrêtées</span></div>
   <div class="cards">${live.map(guestCard).join("")}</div>
   <details class="fold" ${params.get("open")==="stopped"?"open":""}><summary>${ico("chev").replace('class="ico"','class="ico chev"')}<b>Arrêtées</b><span class="pill sm t-neutral nodot">${stopped.length}</span></summary>
     <div class="cards">${stopped.map(guestCard).join("")}</div></details>
   <details class="fold"><summary>${ico("chev").replace('class="ico"','class="ico chev"')}<b>Modèles</b><span class="pill sm t-neutral nodot">${templates.length}</span><span class="muted">Pas démarrables, pas sauvegardés</span></summary>
     <div class="chips">${templates.map(g=>`<span class="chip">${ico("vm")}<b>${g[2]}</b><span class="mono muted">${g[0]}</span></span>`).join("")}</div></details></div>`;
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{const m=b.parentElement.querySelector(".menu");m.hidden=!m.hidden});
</script>
</body>
</html>
