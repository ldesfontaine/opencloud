<title>openCloud · Carte Réseau de la vue d'ensemble (maquette)</title>
<!-- Maquette de la carte « Réseau » de la vue d'ensemble (R1). Données
fictives (adresses de documentation et 10.20.x.x seulement). Paramètres de
l'adresse : ?v=A|B|C (variante) · ?theme=light|dark · ?fold=all|none.

Notes pour l'implémentation
- Mise en page : boîtes en HTML/CSS (grille, flex), un calque SVG absolu
  au-dessus pour les traits. Rien n'est placé en coordonnées à la main.
- Colonnes (≥ 860 px) : Dehors 232 px · bande Internet 104 px · Maison
  (pare-feu 240 px, couloir de 72 px, hôtes et zones 1fr). Sans VPS, la
  colonne Dehors disparaît ; sans pare-feu, la Maison n'a que les hôtes.
- Teinte de zone : un indice 0 à 7 donné par le serveur à la création de la
  zone (jamais recalculé à l'affichage). La couleur se dérive de l'accent :
  oklch(from var(--accent) l c calc(h + indice × 45)). Une variable locale du
  composant (--hue, --zone), aucun jeton ajouté ; clair et sombre suivent
  l'accent du thème. Elle ne sert qu'au liseré, aux pastilles et aux
  connecteurs : le texte reste en --ink / --ink-2, le nom de zone est écrit.
- Ancres : chaque puce, ligne d'interface, en-tête d'hôte et pastille de la
  bande porte data-node ; on mesure getBoundingClientRect() moins celui de
  la carte. Une extrémité dans un hôte replié se rabat sur l'en-tête de
  l'hôte ; deux liens qui tombent alors sur les mêmes ancres n'en font qu'un
  (« 2 liens » dans l'info-bulle). Retracé au ResizeObserver de la carte et
  à chaque repli.
- Tracés : lien entre services = courbe de Bézier entre les côtés qui se
  font face ; connecteurs du pare-feu = traits orthogonaux arrondis dans le
  couloir, un rail par trait, le plus haut à droite (pas de croisement). Un
  trait qui traverse le pare-feu passe par la ligne de son interface : WAN
  pour une entrée Internet, wg0 pour ce qui emprunte le tunnel.
- Repli : replié par défaut quand la carte compte plus de 12 boîtes de
  machine, sauf l'hôte qui porte une puce en échec ou absente. Replié,
  l'en-tête dit « 12 machines · 18 services », ses zones, et une pastille
  pour ce qui est dégradé, en échec ou absent.
- Une machine sans service et sans invité n'a pas de boîte : une ligne par
  conteneur, « 3 machines sans service : a · b · c », chaque nom un lien.
  Elle ne compte pas dans la règle des 12.
- Sous 860 px : Dehors, puis la bande Internet en largeur, puis la Maison ;
  le calque SVG disparaît et les liens passent dans la liste « Liens » sous
  la carte, ouverte. -->

[hidden]{display:none!important}

<script>
const params = new URLSearchParams(location.search);
const theme = params.get("theme");
if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
const variant = ["A", "B", "C"].includes(params.get("v")) ? params.get("v") : "A";

const firewall = {
  name: "pare-feu", ip: "10.20.11.1",
  rows: [
    { role: "wan", dev: "igb0", cidr: "198.51.100.7/24" },
    { role: "tunnel", dev: "wg0", cidr: "10.20.99.2/30" },

  const box = a.el.closest(".mach");
  if (box && box === b.el.closest(".mach")) {
    // Départ sous le milieu, arrivée au-dessus : deux accolades qui se suivent ne se touchent pas.
    const dir = Math.sign(b.cy - a.cy) || 1, y1 = a.cy + 4 * dir, y2 = b.cy - 4 * dir;
    const x = Math.max(a.right, b.right) + 10 + Math.abs(b.cy - a.cy) * 0.15;
    return `M${a.right},${y1} C${x},${y1} ${x},${y2} ${b.right},${y2}`;
  }
  const { p, q } = facingPair(a, b);
  const k = Math.max(20, Math.min(80, Math.hypot(q.x - p.x, q.y - p.y) * 0.4));
  return bezier(p, q, k);
}
function horizontalCurve(x1, y1, x2, y2) {
  const k = Math.max(16, Math.abs(x2 - x1) * 0.5);
  const dir = x2 > x1 ? 1 : -1;
  return `M${x1},${y1} C${x1 + dir * k},${y1} ${x2 - dir * k},${y2} ${x2},${y2}`;
}
// Trait orthogonal aux angles arrondis, par une suite de points.
function roundedPath(points, radius = 6) {
  const pts = points.filter((p, i) => i === 0 || Math.hypot(p[0] - points[i - 1][0], p[1] - points[i - 1][1]) > 0.5);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(x - px, y - py), l2 = Math.hypot(nx - x, ny - y);
    const r = Math.min(radius, l1 / 2, l2 / 2);
    d += ` L${x - ((x - px) / l1) * r},${y - ((y - py) / l1) * r} Q${x},${y} ${x + ((nx - x) / l2) * r},${y + ((ny - y) / l2) * r}`;
  }
  const last = pts[pts.length - 1];
  return `${d} L${last[0]},${last[1]}`;
}
// L'arrivée d'un trait venu du couloir : droit sur la puce quand sa machine
// est dans la première colonne de la zone, sinon par l'interstice au-dessus
// de la machine, pour ne pas traverser ses voisines.
function approachTo(target) {
  const straight = { y: target.cy, tail: [[target.left, target.cy]] };
  const box = target.el.closest(".mach");
  if (!box) return straight;
  const b = rectOf(box), zone = rectOf(box.closest(".zone"));
  if (b.left - zone.left < 30) return straight;
  const gap = b.top - 4, x = target.left + 14;
  return { y: gap, tail: [[x, gap], [x, target.top]] };
}
function linkGroup(className, tip, ends) {
  const g = el("g", { class: `lk ${className}`, tabindex: "0", role: "img", "aria-label": tip.replace(/<[^>]+>/g, "") });
  g.dataset.tip = tip;
  g.dataset.ends = ends.join(" ");
  return g;
}
function stroke(g, d, cls, marker) {
  const attrs = { d, class: `w ${cls}` };
  if (marker) attrs["marker-end"] = "url(#arrow)";
  el("path", attrs, g);
  el("path", { d, class: "hit" }, g);
}
function pulse(g, d) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dot = el("circle", { r: "2.6", class: "pulse" }, g);
  el("animateMotion", { dur: "2.6s", repeatCount: "indefinite", path: d }, dot);
}
function badge(g, d, text) {
  const probe = el("path", { d, fill: "none" }, g);
  // Aux trois quarts, côté cible : le milieu tombe souvent sur un en-tête de zone.
  const mid = probe.getPointAtLength(probe.getTotalLength() * 0.72);
  probe.remove();
  const b = el("g", { class: "badge" }, g);
  // Un « ? » de 16 px : le mot est dans la légende, l'info-bulle et la liste des liens.
  el("rect", { x: mid.x - 8, y: mid.y - 8, width: 16, height: 16, rx: 8 }, b);
  const t = el("text", { x: mid.x, y: mid.y + 3.5, "text-anchor": "middle" }, b);
  t.textContent = text;
}

// Place les pastilles de la bande à la hauteur de ce qu'elles relient, sans chevauchement.
function placeBandPills(fwRows) {
  const band = rectOf(map.querySelector("#band"));
  const head = rectOf(map.querySelector(".band-h"));
  const pills = [];
  if (data.tunnel) pills.push({ node: "bp:tunnel", y: fwRows.tunnel ? fwRows.tunnel.cy : anchorOf(`svc:${data.tunnel.from}`).cy });
  data.entries.forEach((e, i) => {
    const target = anchorOf(`svc:${e.to}`);
    const outside = data.out.some((m) => m.services.some((s) => s.id === e.to));
    pills.push({ node: `bp:entry:${i}`, y: !outside && fwRows.wan ? fwRows.wan.cy : target.cy });
  });
  pills.sort((a, b) => a.y - b.y);
  let floor = head.bottom - band.top + 10;
  for (const p of pills) {
    const node = map.querySelector(`[data-node="${p.node}"]`);
    const h = node.offsetHeight;
    const top = Math.max(p.y - band.top - h / 2, floor);
    node.style.top = `${top}px`;
    floor = top + h + 8;
  }
}

function draw() {
  map = document.getElementById("map");
  wires = document.getElementById("wires");
  wires.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M1 1 9 5 1 9z"/></marker></defs>`;
  if (matchMedia("(max-width: 860px)").matches) {
    map.querySelectorAll(".bp").forEach((p) => (p.style.top = ""));
    return;
  }
  wires.setAttribute("width", map.scrollWidth);
  wires.setAttribute("height", map.scrollHeight);
  const band = rectOf(map.querySelector("#band"));
  const fwEl = map.querySelector(".fw");
  const fw = fwEl ? rectOf(fwEl) : null;
  const fwRows = {};
  map.querySelectorAll(".ifc").forEach((row) => (fwRows[row.dataset.node.slice(3)] = rectOf(row)));
  placeBandPills(fwRows);
  const bp = (node) => anchorOf(node);
  const isOutside = (id) => data.out.some((m) => m.services.some((s) => s.id === id));

  // Rails du couloir entre le pare-feu et les hôtes : le plus haut à droite.
  const railJobs = [];
  if (fw) {
    const stackLeft = rectOf(map.querySelector(".stack")).left;
    map.querySelectorAll(".stack .zone").forEach((zone) => {
      if (zone.closest(".host.folded")) return;
      const row = fwRows[zone.dataset.zone];
      if (!row) return;
      const head = rectOf(zone.querySelector(".zone-h"));
      railJobs.push({ y1: row.cy, y2: head.cy, tail: [[rectOf(zone).left, head.cy]], kind: "zone", hue: data.zones[zone.dataset.zone].hue });
    });
    railJobs.gutter = [fw.right, stackLeft];
  }

  // La patte WAN du pare-feu.
  if (fw && fwRows.wan) {
    const g = linkGroup("", "<b>pare-feu · WAN</b><br>igb0 · 198.51.100.7/24", ["if:wan"]);
    stroke(g, horizontalCurve(band.right, fwRows.wan.cy, fwRows.wan.left, fwRows.wan.cy), "wan");
  }

  // Le tunnel : un tube, cadenas et mots dans la bande.
  if (data.tunnel) {
    const from = anchorOf(`svc:${data.tunnel.from}`), pill = bp("bp:tunnel");
    const g = linkGroup("", "<b>WireGuard · chiffré</b><br>vps-edge ⇄ pare-feu (wg0)", [`svc:${data.tunnel.from}`, "if:tunnel"]);
    const d1 = horizontalCurve(from.right, from.cy, pill.left, pill.cy);
    const target = fwRows.tunnel;
    const d2 = horizontalCurve(pill.right, pill.cy, target.left, target.cy);
    for (const d of [d1, d2]) { el("path", { d, class: "w tube" }, g); el("path", { d, class: "w tube-in" }, g); el("path", { d, class: "hit" }, g); }
  }

  // Entrées Internet.
  data.entries.forEach((e, i) => {
    const pill = bp(`bp:entry:${i}`), target = anchorOf(`svc:${e.to}`);
    const name = serviceIndex.get(e.to).name;
    const g = linkGroup("", `<b>Internet → ${name}</b><br>ports publiés ${e.ports}${e.seen ? " · connexion d'Internet vue" : " · aucune connexion vue"}`, [`svc:${e.to}`]);
    if (isOutside(e.to)) {
      stroke(g, horizontalCurve(pill.left, pill.cy, target.right, target.cy), "entry", true);
    } else if (fw) {
      stroke(g, horizontalCurve(pill.right, pill.cy, fwRows.wan.left, fwRows.wan.cy), "entry");
      const a = approachTo(target);
      railJobs.push({ y1: fwRows.wan.cy, y2: a.y, tail: a.tail, kind: "pass", group: g, cls: "entry" });
    } else {
      stroke(g, horizontalCurve(pill.right, pill.cy, target.left, target.cy), "entry", true);
    }
  });

  // Liens entre services, fusionnés quand un repli les pose sur les mêmes ancres.
  const merged = new Map();
  for (const link of data.links) {
    const a = anchorOf(`svc:${link.from}`), b = anchorOf(`svc:${link.to}`);
    if (!a || !b || a.el === b.el) continue;
    const key = `${a.el.dataset.node}|${b.el.dataset.node}`;
    if (merged.has(key)) { merged.get(key).links.push(link); continue; }
    merged.set(key, { a, b, links: [link] });
  }
  for (const { a, b, links } of merged.values()) {
    const link = links[0];
    const names = `${a.el.classList.contains("host-h") ? a.el.dataset.node.slice(5) + " (replié)" : serviceIndex.get(link.from).name} → ${b.el.classList.contains("host-h") ? b.el.dataset.node.slice(5) + " (replié)" : serviceIndex.get(link.to).name}`;
    const detail = links.map(linkSentence).join("<br>");
    const tip = `<b>${names}</b>${links.length > 1 ? ` · ${links.length} liens` : ""}<br>${detail}${link.confirm ? "<br>à confirmer : route déduite" : ""}${link.stale ? "<br>ancien : plus vu depuis 7 jours" : ""}`;
    const cls = `${link.ev}${link.stale ? " stale" : ""}`;
    const g = linkGroup(link.stale ? "stale-g" : "", tip, [a.el.dataset.node, b.el.dataset.node]);
    if (link.via === "tunnel" && fw && isOutside(link.from)) {
      // Ce qui emprunte le tunnel passe par la ligne wg0 du pare-feu.
      const row = fwRows.tunnel, y = row.cy + 9;
      const d = horizontalCurve(a.right, a.cy + 4, row.left, y);
      stroke(g, d, cls);
      if (link.ev === "observed") pulse(g, d);
      const ap = approachTo(b);
      railJobs.push({ y1: y, y2: ap.y, tail: ap.tail, kind: "pass", group: g, cls, ev: link.ev });
      continue;
    }
    const d = curveBetween(a, b);
    stroke(g, d, cls, true);
    if (link.ev === "observed" && !link.stale) pulse(g, d);
    if (link.confirm) badge(g, d, "?");
  }

  // Le couloir : un rail par trait.
  if (fw) {
    const [gx1, gx2] = railJobs.gutter;
    const jobs = railJobs.slice().sort((p, q) => p.y1 - q.y1 || q.y2 - p.y2);
    const step = Math.min(8, (gx2 - gx1 - 20) / Math.max(1, jobs.length - 1));
    jobs.forEach((job, i) => {
      const lane = gx2 - 10 - i * step;
      const d = roundedPath([[fw.right, job.y1], [lane, job.y1], [lane, job.y2], ...job.tail]);
      if (job.kind === "zone") {
        const g = el("g", { class: "hue", style: `--hue:${job.hue}` });
        el("path", { d, class: "w zc" }, g);
      } else {
        stroke(job.group, d, job.cls, true);
        if (job.ev === "observed") pulse(job.group, d);
      }
    });
  }
}

// ——— Interactions ———
function bindTips() {
  const tip = document.getElementById("tip");
  const show = (g, x, y) => {
    tip.innerHTML = g.dataset.tip;
    tip.hidden = false;
    const w = map.clientWidth;
    tip.style.left = `${Math.min(x + 14, w - tip.offsetWidth - 8)}px`;
    tip.style.top = `${y + 14}px`;
    g.classList.add("hot");
  };
  const hide = (g) => { tip.hidden = true; g.classList.remove("hot"); };
  map.addEventListener("pointermove", (ev) => {
    const g = ev.target.closest && ev.target.closest(".lk");
    map.querySelectorAll(".lk.hot").forEach((h) => h !== g && hide(h));
    if (g) { const m = map.getBoundingClientRect(); show(g, ev.clientX - m.left, ev.clientY - m.top); }
  });
  map.addEventListener("pointerleave", () => map.querySelectorAll(".lk.hot").forEach(hide));
  map.addEventListener("focusin", (ev) => {
    const g = ev.target.closest(".lk");
    if (g) { const r = rectOf(g); show(g, r.cx, r.cy); }
    // Le focus d'une puce allume ses liens.
    const node = ev.target.closest("[data-node]");
    if (node && node.classList.contains("svc")) highlight(node.dataset.node, true);
  });
  map.addEventListener("focusout", (ev) => {
    const g = ev.target.closest(".lk");
    if (g) hide(g);
    highlight(null, false);
  });
  map.addEventListener("pointerover", (ev) => {
    const node = ev.target.closest && ev.target.closest(".svc");
    highlight(node ? node.dataset.node : null, !!node);
  });
}
function highlight(node, on) {
  map.querySelectorAll(".lk.hot, .svc.hot").forEach((h) => h.classList.remove("hot"));
  if (!on || !node) return;
  map.querySelector(`[data-node="${node}"]`).classList.add("hot");
  map.querySelectorAll(".lk").forEach((g) => { if (g.dataset.ends.split(" ").includes(node)) g.classList.add("hot"); });
}
function syncFoldAll() {
  const hosts = [...map.querySelectorAll(".host")];
  const btn = document.getElementById("foldAll");
  btn.hidden = hosts.length === 0;
  const anyOpen = hosts.some((h) => !h.classList.contains("folded"));
  btn.textContent = anyOpen ? "Tout replier" : "Tout déplier";
}
function bindFolds() {
  map.querySelectorAll(".fold").forEach((b) => (b.onclick = () => {
    const host = b.closest(".host");
    host.classList.toggle("folded");
    b.setAttribute("aria-expanded", String(!host.classList.contains("folded")));
    syncFoldAll(); draw();
  }));
  document.getElementById("foldAll").onclick = () => {
    const hosts = [...map.querySelectorAll(".host")];
    const fold = hosts.some((h) => !h.classList.contains("folded"));
    hosts.forEach((h) => { h.classList.toggle("folded", fold); h.querySelector(".fold").setAttribute("aria-expanded", String(!fold)); });
    syncFoldAll(); draw();
  };
}

render();
map = document.getElementById("map");
document.querySelectorAll(".tabs a").forEach((a) => {
  if (a.dataset.v === variant) a.setAttribute("aria-current", "page");
  const p = new URLSearchParams(location.search); p.set("v", a.dataset.v); a.href = `?${p}`;
});
document.getElementById("vnote").textContent = data.note;
const themeBtn = document.getElementById("theme");
const isDark = () => document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
const syncTheme = () => (themeBtn.textContent = isDark() ? "Thème clair" : "Thème sombre");
themeBtn.onclick = () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; syncTheme(); };
syncTheme();
if (matchMedia("(max-width: 860px)").matches) document.getElementById("linklist").open = true;
syncFoldAll(); bindFolds(); bindTips();
draw();
new ResizeObserver(() => requestAnimationFrame(draw)).observe(map);
</script>
</body>
